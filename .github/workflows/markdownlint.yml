name: markdownlint
on:
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - name: Run markdownlint (non-blocking)
        run: |
          npx --yes markdownlint-cli@0.39.0 "**/*.md" || true
