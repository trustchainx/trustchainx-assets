name: markdownlint
on:
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Run markdownlint (non-blocking)
        run: |
          npx --yes markdownlint-cli@0.39.0 "**/*.md" || true
